name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_call:

jobs:
  mobile-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.7'

      - name: Instalar dependencias
        run: flutter pub get

      - name: Verificar formato
        run: dart format --set-exit-if-changed .

      - name: Analizar código
        run: flutter analyze

      - name: Correr tests
        run: flutter test

      - name: Compilar Flutter Web
        run: flutter build web --release --dart-define=API_BASE_URL=https://api.77.112.195.118.sslip.io
