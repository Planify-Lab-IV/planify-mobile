name: Distribuir Android a testers

on:
  push:
    branches:
      - main
  workflow_dispatch:


env:
  BUILD_NUMBER_OFFSET: 1

concurrency:
  group: distribute-android
  cancel-in-progress: true

jobs:
  ci:
    name: Validar app
    uses: ./.github/workflows/ci.yml

  distribute:
    name: Compilar y distribuir APK
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: testers

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restaurar firma de release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > planify-release.jks

          # En un archivo .properties, la barra invertida es un escape.
          store_password="${ANDROID_KEYSTORE_PASSWORD//\\/\\\\}"
          key_password="${ANDROID_KEY_PASSWORD//\\/\\\\}"
          {
            printf 'storePassword=%s\n' "$store_password"
            printf 'keyPassword=%s\n' "$key_password"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=../../planify-release.jks\n'
          } > android/key.properties

      - name: Validar URL del backend
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$API_BASE_URL" ]]; then
            echo 'API_BASE_URL no está configurada en el environment testers.' >&2
            exit 1
          fi

          if [[ "$API_BASE_URL" == *localhost* || "$API_BASE_URL" == *10.0.2.2* ]]; then
            echo 'API_BASE_URL no puede apuntar a localhost ni al emulador Android.' >&2
            exit 1
          fi

      - name: Compilar APK release
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          build_number=$((GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET))
          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --build-number="$build_number"

      - name: Distribuir en Firebase App Distribution
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event.workflow_run.head_commit.message || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          credentials_file="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$credentials_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$credentials_file"

          short_sha="${GITHUB_SHA::7}"
          release_notes=$(printf 'Commit: %s\n%s\nRun: %s/actions/runs/%s' \
            "$short_sha" "$COMMIT_MESSAGE" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")

          npx firebase-tools@14 appdistribution:distribute \
            build/app/outputs/flutter-apk/app-release.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "$FIREBASE_TESTER_GROUPS" \
            --release-notes "$release_notes"

      - name: Guardar APK del run
        uses: actions/upload-artifact@v4
        with:
          name: planify-release-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
